<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>圖書館借還書系統</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Main application mount point. All pages are rendered by app.js. -->
  <div id="app"></div>

  <!-- Reusable dialog for one book's borrowing history. -->
  <dialog id="historyDialog" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>書籍借閱紀錄</h3>
        <button class="icon-btn" id="closeHistoryBtn" type="button" aria-label="Close">✕</button>
      </div>
      <div id="historyContent" class="history-list"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
